{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Makeup Store</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #0b1f3a; /* azul marino */
            color: #f5f5f5;
        }

        .navbar {
            background-color: #3e2c23; /* marrón suave */
        }

        .navbar-brand {
            font-weight: bold;
            color: #f5f5f5 !important;
        }

        .nav-link {
            color: #f5f5f5 !important;
            transition: 0.3s;
        }

        .nav-link:hover {
            color: #d2b48c !important; /* marrón claro */
        }

        .hero {
            text-align: center;
            margin-top: 100px;
        }

        .btn-custom {
            background-color: #3e2c23;
            color: white;
            border: none;
        }

        .btn-custom:hover {
            background-color: #5a4033;
        }
    </style>
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg">
    <div class="container-fluid">

        <!-- IZQUIERDA -->
        <a class="navbar-brand" href="{% url 'home' %}">Makeup Store</a>

        <!-- BOTÓN MOBILE -->
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>

        <!-- DERECHA -->
        <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
            <ul class="navbar-nav">

                <li class="nav-item">
                    <a class="nav-link" href="{% url 'petra_historia' %}">Historia</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="{% url 'producto_list' %}">Producto</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="{% url 'petra_reseña' %}">Reseña</a>
                </li>

            </ul>
        </div>
    </div>
</nav>

<!-- CONTENIDO -->
{% block contenido %}
<div class="container">
    <div class="hero">
        <h1>Bienvenido a Petra</h1>
        <p class="mt-3">Descubrí los mejores productos de maquillaje</p>

        <a href="{% url 'producto_list' %}" class="btn btn-custom mt-4">
            Ver Productos
        </a>
    </div>
</div>
{% endblock %}

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
