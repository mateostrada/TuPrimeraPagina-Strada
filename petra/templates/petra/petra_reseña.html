{% extends "petra/index.html" %}

{% block contenido %}

<div class="container mt-5">
    <div class="card p-4 shadow" style="background-color:#34495e; border:none; border-radius:10px;">
        <div class="card p-4">
            <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center mb-4 gap-3">
                <h2 class="fw-bold mb-0"></h2>
            <div class="d-flex gap-2">
                <form class="d-flex" role="search">
                    <input type="text" name="autor" class="form-control" placeholder="Buscar por nombre..." value="{{ request.GET.nombre }}">
                </form>
            <a href="{% url "petra_create"  %}" class="btn btn-primary"> + Nueva reseña</a>
            </div>
        </div>
        <!-- TÍTULO + BOTÓN VOLVER -->
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>Reseñas</h2>
            <a href="{% url 'home' %}" class="btn btn-custom">Volver</a>
        </div>

        <table class="table table-bordered table-hover text-center align-middle" style="color:white;">
            
            <thead style="background-color:#3e2c23;">
                <tr>
                    <th>Autor</th>
                    <th>Reseña</th>
                    <th>Calificación</th>
                </tr>
            </thead>

            <tbody>
                {% for resena in petra_reseña %}
                <tr style="background-color:#2c3e50;">
                    <td>{{ resena.autor }}</td>
                    <td>{{ resena.comentario }}</td>
                    <td>{{ resena.calificacion }}</td>
                </tr>
                {% empty %}
                <tr>
                    <td colspan="3">No hay reseñas cargadas</td>
                </tr>
                {% endfor %}
            </tbody>

        </table>

    </div>
</div>

{% endblock %}
