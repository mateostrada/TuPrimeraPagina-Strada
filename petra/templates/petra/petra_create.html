{% extends "petra/index.html" %}

{% block contenido %}

<div class="container mt-5">

    <h2 class="text-center mb-4">Crear Reseña</h2>

    <form method="POST" class="p-4 rounded" style="background-color:#1a2a4a;">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit" class="btn btn-custom w-100">
            Guardar Reseña
        </button>

    </form>

    {{ form.errors }}

</div>

{% endblock %}
