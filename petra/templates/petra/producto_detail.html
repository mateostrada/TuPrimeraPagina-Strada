{% extends "petra/index.html" %}

{% block contenido %}

<style>
    body {
        background-color: #0b1f3a;
        color: white;
    }

    .detail-card {
        background-color: #34495e;
        border-radius: 15px;
        padding: 40px;
        box-shadow: 0px 0px 15px rgba(0,0,0,0.4);
    }

    .btn-custom {
        background-color: #5c3b2e;
        color: white;
        border: none;
        border-radius: 8px;
        padding: 10px 20px;
        text-decoration: none;
        transition: 0.3s;
    }

    .btn-custom:hover {
        background-color: #7a4f3b;
        color: white;
    }
</style>

<div class="container mt-5">

    <div class="detail-card">

        <h1 class="mb-4">{{ object.producto }}</h1>

        <h4>Cantidad disponible</h4>
        <p>{{ object.cantidades_disponibles }}</p>

        <h4>Precio</h4>
        <p>$ {{ object.precio }}</p>

        <div class="mt-4">

            <a href="{% url 'producto_update' object.id %}"
               class="btn-custom">
                Editar
            </a>

            <a href="{% url 'producto_delete' object.id %}"
               class="btn-custom">
                Eliminar
            </a>

            <a href="{% url 'producto_list' %}"
               class="btn-custom">
                Volver
            </a>

        </div>

    </div>

</div>

{% endblock %}
