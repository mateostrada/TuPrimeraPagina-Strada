{% extends "petra/index.html" %}

{% block titulo %}
<title>Iniciar Sesion</title>
{% endblock %}

{% block contenido %}

<style>
    body {
        background-color: #0b1f3a;
        color: #f5f5f5;
    }

    .login-card {
        background-color: #34495e;
        border: none;
        border-radius: 15px;
        box-shadow: 0px 4px 15px rgba(0,0,0,0.4);
    }

    .login-title {
        color: #f5f5f5;
        font-weight: bold;
    }

    .form-label {
        color: #f5f5f5;
        font-weight: 500;
    }

    .btn-custom {
        background-color: #3e2c23;
        color: white;
        border: none;
        transition: 0.3s;
    }

    .btn-custom:hover {
        background-color: #5a3f32;
        transform: scale(1.02);
    }

    input {
        background-color: #ecf0f1 !important;
    }

    .extra-text {
        color: #dcdcdc;
    }

    .extra-text a {
        color: #d2b48c;
        text-decoration: none;
        font-weight: bold;
    }

    .extra-text a:hover {
        color: white;
    }
</style>

<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-5">

            <div class="login-card p-5">

                <h2 class="text-center mb-4 login-title">
                    Iniciar Sesión
                </h2>

                <form method="POST">

                    {% csrf_token %}

                    <!-- USERNAME -->
                    <div class="mb-3">
                        <label class="form-label">
                            Usuario
                        </label>

                        <input type="text"
                               name="username"
                               class="form-control">
                    </div>

                    <!-- PASSWORD -->
                    <div class="mb-4">
                        <label class="form-label">
                            Contraseña
                        </label>

                        <input type="password"
                               name="password"
                               class="form-control">
                    </div>

                    <!-- BOTÓN -->
                    <button type="submit"
                            class="btn btn-custom w-100 py-2">

                        Ingresar

                    </button>

                </form>

                <!-- REGISTER -->
                <div class="text-center mt-4 extra-text">

                    ¿No tienes cuenta?

                    <a href="{% url 'register' %}">
                        Registrarse
                    </a>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
