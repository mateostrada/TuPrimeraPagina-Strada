{% extends "petra/index.html" %}

{% block titulo %}
<title>Editar Perfil</title>
{% endblock %}

{% block contenido %}

<style>
    body {
        background-color: #0b1f3a;
        color: #f5f5f5;
    }

    .profile-card {
        background-color: #34495e;
        border: none;
        border-radius: 15px;
        box-shadow: 0px 4px 15px rgba(0,0,0,0.4);
    }

    .profile-title {
        color: #f5f5f5;
        font-weight: bold;
    }

    .form-label {
        color: #f5f5f5;
        font-weight: 500;
    }

    .btn-custom {
        background-color: #3e2c23;
        color: white;
        border: none;
        transition: 0.3s;
    }

    .btn-custom:hover {
        background-color: #5a3f32;
        transform: scale(1.02);
    }

    input {
        background-color: #ecf0f1 !important;
    }
</style>

<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-7">

            <div class="profile-card p-5">

                <h2 class="text-center mb-4 profile-title">
                    Editar Perfil
                </h2>

                <form method="POST" enctype="multipart/form-data">

                    {% csrf_token %}

                    <!-- AVATAR -->
                    <div class="mb-3">
                        <label class="form-label">
                            Avatar
                        </label>
                        {{ form.avatar }}
                    </div>

                    <!-- NOMBRE -->
                    <div class="mb-3">
                        <label class="form-label">
                            Nombre
                        </label>
                        {{ form.first_name }}
                    </div>

                    <!-- APELLIDO -->
                    <div class="mb-3">
                        <label class="form-label">
                            Apellido
                        </label>
                        {{ form.last_name }}
                    </div>

                    <!-- PAÍS -->
                    <div class="mb-3">
                        <label class="form-label">
                            País
                        </label>
                        {{ form.pais }}
                    </div>

                    <!-- DIRECCIÓN -->
                    <div class="mb-3">
                        <label class="form-label">
                            Dirección
                        </label>
                        {{ form.direccion }}
                    </div>

                    <!-- DNI -->
                    <div class="mb-3">
                        <label class="form-label">
                            DNI
                        </label>
                        {{ form.dni }}
                    </div>

                    <!-- FECHA -->
                    <div class="mb-4">
                        <label class="form-label">
                            Fecha de nacimiento
                        </label>
                        {{ form.fecha_de_nacimiento }}
                    </div>

                    

                    <!-- BOTÓN -->
                    <button type="submit"
                            class="btn btn-custom w-100 py-2">

                        Guardar Cambios

                    </button>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
